; Firmware em C (ESP-IDF) da ponte BLE <-> RS-232 - ESP32-C3 Super Mini
; VS Code + extensao PlatformIO: abra ESTA pasta (firmware/) e use
;   Build (check), Upload (seta) e Monitor (tomada) na barra azul de baixo.

[platformio]
src_dir = main
default_envs = supermini

[env:supermini]
platform = espressif32 @ 6.9.0
framework = espidf
board = esp32-c3-devkitm-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
upload_speed = 460800
monitor_speed = 115200
monitor_filters = direct
; USB nativo do C3: com DTR/RTS em 0 o monitor nao segura a placa em reset/boot
monitor_dtr = 0
monitor_rts = 0
; se o Upload nao achar a porta sozinho, descomente e ajuste:
; upload_port = COM10
; monitor_port = COM10
